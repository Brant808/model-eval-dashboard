# Daily autorefresh (Phase 7). Fetch -> optional judgment layer -> data gate ->
# commit data -> build -> full constitutional gate -> tests -> commit page.
# GitHub Pages serves docs/ via deploy-from-branch (Phase 8), so the docs
# commit IS the deploy: a run that fails the gate publishes nothing, and the
# last green page keeps serving.
#
# Gate riders adopted (governance/redteam/phase-7.md, innovator phases 6-8):
# - data/ commits BEFORE build/tests: a renderer or UI-test failure must never
#   cost a day of history (snapshots are constitutionally kept forever).
# - the data-only gate passes --html /nonexistent: the checkout's docs/ is
#   yesterday's page and would falsely fail display checks; the page is fully
#   re-gated with REQUIRE_HTML=1 after the rebuild, before it is committed.
# - two cron entries: the second is an idempotent retry against GitHub's
#   documented schedule delays/drops (concurrency group serializes; an
#   unchanged day exits at "no changes to publish").
# - fetch-depth 1: history-derived data (sparklines) comes from data/*.json at
#   HEAD, never from git history; full clones only grow CI time forever.
#
# The judgment layer is OFF by default (mechanical tape only). It activates
# only when the ANTHROPIC_API_KEY repository secret exists AND its output
# survives tools/judgment.py's schema + no-new-facts validation (one Messages
# API call — no extra toolchain in the runner). A rejected or absent judgment
# never blocks the mechanical publish.

name: daily-refresh

# PAUSED (2026-08-04, owner request): the cron schedule is removed, so nothing
# runs automatically. The pipeline stays fully functional for on-demand use via
# Actions -> daily-refresh -> Run workflow. To resume daily refreshes, restore
# under `on:` the block:
#   schedule:
#     - cron: "30 12 * * *"   # 12:30 UTC = 05:30 Pacific (PDT)
#     - cron: "15 13 * * *"   # idempotent retry against schedule drops
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 5
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch (live collectors, honest degradation)
        timeout-minutes: 15
        env:
          COLLECTOR_RETRIES: "1"
          COLLECTOR_TIMEOUT_S: "45"
        run: COLLECT=1 make fetch

      - name: Judgment layer (only if secret present; validated or discarded)
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python3 tools/judgment.py || echo "judgment layer degraded to mechanical (see log above)"
            make fetch   # re-materialize latest.json (SYNC rule) after any edit
          else
            echo "ANTHROPIC_API_KEY not set — shipping mechanical tape (designed default)"
          fi

      - name: Data-only constitutional gate
        timeout-minutes: 5
        run: python3 tools/check_invariants.py --html /nonexistent

      - name: Commit snapshots (history is kept even if the page build fails)
        timeout-minutes: 5
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "daily refresh: $(date -u +%F) snapshot"
            n=0
            until git push origin HEAD; do
              n=$((n+1)); [ $n -ge 4 ] && exit 1
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep $((2 ** n))
            done
          fi

      - name: Build page
        timeout-minutes: 5
        run: make build

      - name: Full constitutional gate (all 12 rules, HTML required)
        timeout-minutes: 5
        run: REQUIRE_HTML=1 make check

      - name: Tests
        timeout-minutes: 10
        run: make test

      - name: Commit rebuilt page (this is the deploy)
        timeout-minutes: 5
        run: |
          git add docs/
          if git diff --cached --quiet; then
            echo "no page changes to publish"
            exit 0
          fi
          git commit -m "daily refresh: $(date -u +%F) rebuilt page"
          n=0
          until git push origin HEAD; do
            n=$((n+1)); [ $n -ge 4 ] && exit 1
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** n))
          done

      - name: Preserve snapshot + linter output on failure (forensics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-${{ github.run_id }}
          path: data/
          retention-days: 90
